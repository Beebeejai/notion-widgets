<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Countdown - Months & Days</title>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent !important;
            /* 隱藏捲軸，確保喺 Notion 縮細個 frame 時唔會出 scrollbar */
            overflow: hidden; 
        }

        .countdown-container {
            display: flex;
            flex-direction: column; /* 改為垂直排列，等鐘同日期上下疊住 */
            align-items: center;
            background-color: #1c1c1e; /* 黑色範圍 */
            border-radius: 12px;
            padding: 30px 45px 20px 45px; /* 稍微較細底部 padding，令視覺更緊湊 */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            font-family: 'Share Tech Mono', monospace;
        }

        .clocks-row {
            display: flex;
            gap: 25px; 
            margin-bottom: 25px; /* 跳字鐘同底部日期嘅距離 */
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flap {
            position: relative;
            background-color: #2c2c2e;
            width: 100px; 
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5rem;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0,0,0,0.2);
            overflow: hidden;
            letter-spacing: 2px;
            color: #eeeeee;
        }

        .flap::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #1c1c1e;
            box-shadow: 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .label {
            margin-top: 15px;
            font-size: 1rem;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* 搬入黑色範圍嘅日期設定 */
        .target-date-display {
            font-family: 'Anonymous Pro', monospace;
            color: #d1d1d6; /* 灰白色字，喺黑底上對比清晰但唔會太搶眼 */
            font-size: 0.9rem;
            letter-spacing: 3px;
            opacity: 0.85; /* 加少少透明度提升復古質感 */
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <!-- 上半部：跳字鐘 -->
        <div class="clocks-row">
            <div class="time-box">
                <div class="flap" id="months">00</div>
                <div class="label">Months</div>
            </div>
            <div class="time-box">
                <div class="flap" id="days">00</div>
                <div class="label">Days</div>
            </div>
        </div>
        
        <!-- 下半部：灰白色確實日期 -->
        <div class="target-date-display" id="target-date"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let dateParam = urlParams.get('date');

        const fallbackDate = "2026-11-20T00:00:00"; 
        const targetDate = new Date(dateParam ? dateParam : fallbackDate);

        const targetDd = targetDate.getDate().toString().padStart(2, '0');
        const targetMm = (targetDate.getMonth() + 1).toString().padStart(2, '0'); 
        const targetYyyy = targetDate.getFullYear();
        document.getElementById("target-date").innerText = `${targetDd}.${targetMm}.${targetYyyy}`;

        function updateCountdown() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const target = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            
            if (target <= today) {
                document.getElementById("months").innerText = "00";
                document.getElementById("days").innerText = "00";
                return;
            }

            let m = (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth());
            let d = target.getDate() - today.getDate();

            if (d < 0) {
                m--;
                const daysInLastMonth = new Date(target.getFullYear(), target.getMonth(), 0).getDate();
                d += daysInLastMonth;
            }

            document.getElementById("months").innerText = m.toString().padStart(2, '0');
            document.getElementById("days").innerText = d.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown(); 
    </script>

</body>
</html>
