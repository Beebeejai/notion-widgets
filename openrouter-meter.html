<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenRouter Credits</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --accent: #10b981;
      --accent-bg: rgba(16, 185, 129, 0.12);
      --warn: #ef4444;
      --warn-bg: rgba(239, 68, 68, 0.12);
      --bar-bg: #e2e8f0;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #191919;
        --card-bg: #222222;
        --text-main: #f1f5f9;
        --text-sub: #94a3b8;
        --border: #333333;
        --accent: #34d399;
        --accent-bg: rgba(52, 211, 153, 0.15);
        --warn: #f87171;
        --warn-bg: rgba(248, 113, 113, 0.18);
        --bar-bg: #334155;
      }
    }

    :root[data-theme="dark"] {
      --bg: #191919;
      --card-bg: #222222;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border: #333333;
      --accent: #34d399;
      --accent-bg: rgba(52, 211, 153, 0.15);
      --warn: #f87171;
      --warn-bg: rgba(248, 113, 113, 0.18);
      --bar-bg: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }

    .widget {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      transition: border-color 0.25s, background-color 0.25s;
    }

    .widget.low-balance {
      border-color: var(--warn);
      background: linear-gradient(180deg, var(--warn-bg) 0%, var(--card-bg) 100%);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .widget.low-balance .dot {
      background-color: var(--warn);
      box-shadow: 0 0 6px var(--warn);
    }

    .actions { display: flex; gap: 6px; }

    button.icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    button.icon-btn:hover { color: var(--text-main); border-color: var(--text-sub); }
    button.icon-btn:active { transform: scale(0.94); }

    .spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .balance-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 4px 0 10px;
    }

    .balance {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }

    .widget.low-balance .balance { color: var(--warn); }

    .currency {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-left: 4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .widget.low-balance .badge {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--bar-bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.4s ease, background-color 0.25s;
    }

    .widget.low-balance .progress-fill { background: var(--warn); }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    .setup-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .setup-panel.active { display: flex; }

    .setup-panel input {
      width: 100%;
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      outline: none;
    }

    .setup-row { display: flex; gap: 6px; }

    .btn {
      flex: 1;
      padding: 7px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .save-btn { background: var(--accent); color: #064e3b; }
    .copy-btn { background: var(--border); color: var(--text-main); }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="header">
      <div class="title">
        <span class="dot"></span>
        <span>OPENROUTER CREDITS</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="refreshBtn" title="立即刷新">↻</button>
        <button class="icon-btn" id="settingsBtn" title="設定 API Key">⚙</button>
      </div>
    </div>

    <div class="balance-row">
      <div>
        <span class="balance" id="balanceText">--.--</span>
        <span class="currency">USD</span>
      </div>
      <span class="badge" id="statusBadge">載入中</span>
    </div>

    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="footer">
      <span id="usageDetail">已用: -- / 總額: --</span>
      <span id="updatedTime">--:--</span>
    </div>

    <div class="setup-panel" id="setupPanel">
      <input type="text" id="keyInput" autocomplete="off" spellcheck="false" placeholder="貼上 Management Key (sk-or-v1-...)" />
      <div class="setup-row">
        <input type="number" id="warnInput" step="0.5" placeholder="警告線 (預設 3)" />
        <button class="btn save-btn" id="saveBtn">儲存</button>
        <button class="btn copy-btn" id="copyUrlBtn">複製網址</button>
      </div>
    </div>
  </div>

  <script>
    const widget = document.getElementById('widget');
    const balanceText = document.getElementById('balanceText');
    const statusBadge = document.getElementById('statusBadge');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const usageDetail = document.getElementById('usageDetail');
    const updatedTime = document.getElementById('updatedTime');
    const refreshBtn = document.getElementById('refreshBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const setupPanel = document.getElementById('setupPanel');
    const keyInput = document.getElementById('keyInput');
    const warnInput = document.getElementById('warnInput');
    const saveBtn = document.getElementById('saveBtn');
    const copyUrlBtn = document.getElementById('copyUrlBtn');

    function cleanKey(raw) {
      return (raw || '').replace(/[\s\r\n]+/g, '');
    }

    function parseHashParams() {
      const hash = window.location.hash.substring(1);
      // 支援 #key=sk-or-... 或直接貼 #sk-or-...
      if (hash.startsWith('sk-or-')) {
        return { key: cleanKey(hash.split('&')[0]), warn: null, theme: '' };
      }
      const params = new URLSearchParams(hash);
      return {
        key: cleanKey(params.get('key')),
        warn: params.get('warn') ? parseFloat(params.get('warn')) : null,
        theme: params.get('theme') || ''
      };
    }

    function getConfig() {
      const hashCfg = parseHashParams();
      let savedKey = '';
      let savedWarn = 3.0;
      try {
        savedKey = cleanKey(localStorage.getItem('or_mgmt_key'));
        const w = localStorage.getItem('or_warn_limit');
        if (w) savedWarn = parseFloat(w);
      } catch (e) {}

      return {
        key: hashCfg.key || savedKey,
        warn: hashCfg.warn !== null && !isNaN(hashCfg.warn) ? hashCfg.warn : savedWarn,
        theme: hashCfg.theme
      };
    }

    function applyTheme(theme) {
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    }

    function formatTime() {
      return new Date().toTimeString().slice(0, 5);
    }

    function renderData(remaining, total, usage, warnLimit) {
      const isLow = remaining <= warnLimit;
      widget.classList.toggle('low-balance', isLow);
      balanceText.textContent = `$${remaining.toFixed(2)}`;

      if (total !== null && total > 0) {
        const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
        progressTrack.style.display = 'block';
        progressFill.style.width = `${pct.toFixed(1)}%`;
        usageDetail.textContent = `已用 $${usage.toFixed(2)} / $${total.toFixed(2)}`;
        statusBadge.textContent = isLow ? '餘額偏低' : `剩 ${Math.round(pct)}%`;
      } else {
        progressTrack.style.display = 'none';
        usageDetail.textContent = '單一 Key 額度上限模式';
        statusBadge.textContent = isLow ? '餘額偏低' : '正常';
      }

      updatedTime.textContent = `更新 ${formatTime()}`;
    }

    async function fetchCredits() {
      const cfg = getConfig();
      applyTheme(cfg.theme);

      if (!cfg.key) {
        widget.classList.remove('low-balance');
        balanceText.textContent = '未設定';
        statusBadge.textContent = '請輸入 Key';
        usageDetail.textContent = '按右上角 ⚙ 設定';
        setupPanel.classList.add('active');
        return;
      }

      refreshBtn.classList.add('spinning');
      try {
        const res = await fetch('https://openrouter.ai/api/v1/credits', {
          headers: { 'Authorization': `Bearer ${cfg.key}` }
        });

        if (res.ok) {
          const json = await res.json();
          const total = Number(json.data.total_credits || 0);
          const usage = Number(json.data.total_usage || 0);
          renderData(total - usage, total, usage, cfg.warn);
          return;
        }

        // 讀取伺服器回傳的具體錯誤原因
        let errMsg = `HTTP ${res.status}`;
        try {
          const errJson = await res.json();
          if (errJson?.error?.message) errMsg = `${res.status}: ${errJson.error.message}`;
        } catch (e) {}

        // 若為 401/403，嘗試看看是否為設有上限的普通 Key
        if (res.status === 401 || res.status === 403) {
          const keyRes = await fetch('https://openrouter.ai/api/v1/auth/key', {
            headers: { 'Authorization': `Bearer ${cfg.key}` }
          });
          if (keyRes.ok) {
            const keyJson = await keyRes.json();
            if (keyJson.data && keyJson.data.limit_remaining !== null) {
              renderData(Number(keyJson.data.limit_remaining), null, null, cfg.warn);
              return;
            }
          }
        }

        throw new Error(errMsg);
      } catch (err) {
        widget.classList.add('low-balance');
        balanceText.textContent = '錯誤';
        statusBadge.textContent = err.message || '連線失敗';
        usageDetail.textContent = `Key 前綴: ${cfg.key.slice(0, 10)}...`;
      } finally {
        refreshBtn.classList.remove('spinning');
      }
    }

    refreshBtn.addEventListener('click', fetchCredits);

    settingsBtn.addEventListener('click', () => {
      const cfg = getConfig();
      keyInput.value = cfg.key;
      warnInput.value = cfg.warn;
      setupPanel.classList.toggle('active');
    });

    function buildShareUrl(key, warn) {
      const base = window.location.origin + window.location.pathname;
      return `${base}#key=${encodeURIComponent(key)}&warn=${warn}`;
    }

    saveBtn.addEventListener('click', () => {
      const newKey = cleanKey(keyInput.value);
      const newWarn = parseFloat(warnInput.value) || 3.0;
      try {
        localStorage.setItem('or_mgmt_key', newKey);
        localStorage.setItem('or_warn_limit', String(newWarn));
      } catch (e) {}

      if (newKey) {
        window.location.hash = `key=${encodeURIComponent(newKey)}&warn=${newWarn}`;
      } else {
        history.replaceState(null, '', window.location.pathname);
      }
      setupPanel.classList.remove('active');
      fetchCredits();
    });

    copyUrlBtn.addEventListener('click', async () => {
      const newKey = cleanKey(keyInput.value) || getConfig().key;
      const newWarn = parseFloat(warnInput.value) || getConfig().warn;
      if (!newKey) return;
      const url = buildShareUrl(newKey, newWarn);
      try {
        await navigator.clipboard.writeText(url);
        copyUrlBtn.textContent = '已複製！';
        setTimeout(() => (copyUrlBtn.textContent = '複製網址'), 1500);
      } catch (e) {
        prompt('請手動複製以下網址貼入 Notion：', url);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) fetchCredits();
    });

    fetchCredits();
  </script>
</body>
</html>
